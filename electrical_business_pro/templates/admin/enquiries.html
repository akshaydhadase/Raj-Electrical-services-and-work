{% extends 'admin/layout.html' %}{% block admin %}<h1>Customer Enquiries</h1><div class="tablewrap"><table class="table"><tr><th>Date</th><th>Name</th><th>Phone</th><th>Email</th><th>Service</th><th>Message</th><th>Status</th></tr>{% for x in items %}<tr><td>{{x.created_at.strftime('%d-%m-%Y %H:%M')}}</td><td>{{x.name}}</td><td>{{x.phone}}</td><td>{{x.email}}</td><td>{{x.service}}</td><td>{{x.message}}</td><td><form method="post" action="{{url_for('enquiry_status',id=x.id)}}"><select name="status" onchange="this.form.submit()"><option {% if x.status=='New' %}selected{% endif %}>New</option><option {% if x.status=='Contacted' %}selected{% endif %}>Contacted</option><option {% if x.status=='Closed' %}selected{% endif %}>Closed</option></select></form></td></tr>{% endfor %}</table></div>{% endblock %}
