<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | {{site.company_name}}</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"></head><body><div class="admin-shell"><aside class="sidebar"><h2>⚡ <span class="label">Admin</span></h2><a href="{{url_for('dashboard')}}">📊 <span class="label">Dashboard</span></a><a href="{{url_for('settings')}}">🏢 <span class="label">Company</span></a><a href="{{url_for('admin_services')}}">⚡ <span class="label">Services</span></a><a href="{{url_for('admin_products')}}">📦 <span class="label">Products</span></a><a href="{{url_for('admin_projects')}}">📸 <span class="label">Projects</span></a><a href="{{url_for('admin_media')}}">🎬 <span class="label">Media Gallery</span></a><a href="{{url_for('admin_tenders')}}">📋 <span class="label">Tenders</span></a><a href="{{url_for('quotations')}}">💰 <span class="label">Quotations</span></a><a href="{{url_for('customers')}}">👥 <span class="label">Customers</span></a><a href="{{url_for('enquiries')}}">📩 <span class="label">Enquiries</span></a><a href="{{url_for('reviews')}}">⭐ <span class="label">Reviews</span></a><a href="{{url_for('password')}}">🔑 <span class="label">Password</span></a><a href="{{url_for('logout')}}">🚪 <span class="label">Logout</span></a></aside><main class="main">{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="alert {{c}}">{{m}}</div>{% endfor %}{% endwith %}{% block admin %}{% endblock %}</main></div></body></html>
