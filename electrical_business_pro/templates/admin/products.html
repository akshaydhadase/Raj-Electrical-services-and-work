{% extends 'admin/layout.html' %}{% block admin %}<h1>Products & Stock</h1><div class="card"><form method="post" class="form"><input name="code" placeholder="Product code"><input name="name" placeholder="Product name" required><input name="brand" placeholder="Brand"><input name="price" type="number" step="0.01" placeholder="Price"><input name="stock" type="number" placeholder="Stock"><input name="min_stock" type="number" value="5" placeholder="Min stock"><label><input type="checkbox" name="active" checked> Active</label><button class="btn">Add Product</button></form></div><br><div class="tablewrap"><table class="table"><tr><th>Code</th><th>Name</th><th>Brand</th><th>Price</th><th>Stock</th><th>Action</th></tr>{% for x in items %}<tr><td>{{x.code}}</td><td>{{x.name}}</td><td>{{x.brand}}</td><td>₹{{'%.2f'|format(x.price)}}</td><td>{{x.stock}}</td><td><form method="post" action="{{url_for('product_delete',id=x.id)}}"><button class="btn danger">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
