{% extends 'admin/layout.html' %}{% block admin %}<h1>Projects / Gallery</h1><div class="card"><form method="post" enctype="multipart/form-data" class="form"><input name="title" placeholder="Project title" required><input name="client" placeholder="Client"><input name="location" placeholder="Location"><input name="project_type" placeholder="Project type"><input name="value" type="number" step="0.01" placeholder="Value"><input name="completion_date" type="date"><input name="image" type="file" accept=".jpg,.jpeg,.png,.webp,.gif"><textarea name="description" placeholder="Description"></textarea><label><input type="checkbox" name="active" checked> Show on website</label><button class="btn">Add Project</button></form></div><br><div class="tablewrap"><table class="table"><tr><th>Title</th><th>Client</th><th>Location</th><th>Action</th></tr>{% for x in items %}<tr><td>{{x.title}}</td><td>{{x.client}}</td><td>{{x.location}}</td><td><form method="post" action="{{url_for('project_delete',id=x.id)}}"><button class="btn danger">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
