{% extends 'admin/layout.html' %}{% block admin %}<h1>Quotations</h1><div class="card"><form method="post" class="form"><input name="quote_no" placeholder="Quotation No" required><input name="customer" placeholder="Customer" required><input name="phone" placeholder="Phone"><input name="subtotal" type="number" step="0.01" placeholder="Subtotal"><input name="discount" type="number" step="0.01" value="0" placeholder="Discount"><input name="gst" type="number" step="0.01" value="18" placeholder="GST %"><select name="status"><option>Draft</option><option>Sent</option><option>Accepted</option><option>Rejected</option></select><button class="btn">Create Quotation</button></form></div><br><div class="tablewrap"><table class="table"><tr><th>No</th><th>Customer</th><th>Subtotal</th><th>Discount</th><th>GST</th><th>Total</th><th>Status</th></tr>{% for x in items %}<tr><td>{{x.quote_no}}</td><td>{{x.customer}}</td><td>₹{{'%.2f'|format(x.subtotal)}}</td><td>₹{{'%.2f'|format(x.discount)}}</td><td>{{x.gst}}%</td><td><b>₹{{'%.2f'|format(x.total)}}</b></td><td>{{x.status}}</td></tr>{% endfor %}</table></div>{% endblock %}
