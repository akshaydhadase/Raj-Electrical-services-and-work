{% extends 'admin/layout.html' %}{% block admin %}<h1>Reviews</h1><div class="tablewrap"><table class="table"><tr><th>Name</th><th>Rating</th><th>Comment</th><th>Approved</th><th>Action</th></tr>{% for x in items %}<tr><td>{{x.customer_name}}</td><td>{{'★'*x.rating}}</td><td>{{x.comment}}</td><td>{{x.approved}}</td><td>{% if not x.approved %}<form method="post" action="{{url_for('approve',id=x.id)}}" style="display:inline"><button class="btn success">Approve</button></form>{% endif %}<form method="post" action="{{url_for('review_delete',id=x.id)}}" style="display:inline"><button class="btn danger">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
