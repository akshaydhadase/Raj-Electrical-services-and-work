{% extends 'admin/layout.html' %}{% block admin %}<h1>Services</h1><div class="card"><form method="post" class="form"><input name="title" placeholder="Service title" required><input name="icon" placeholder="Icon"><textarea name="description" placeholder="Description"></textarea><label><input type="checkbox" name="active" checked> Active</label><button class="btn">Add Service</button></form></div><br><div class="tablewrap"><table class="table"><tr><th>Title</th><th>Description</th><th>Action</th></tr>{% for x in items %}<tr><td>{{x.title}}</td><td>{{x.description}}</td><td><form method="post" action="{{url_for('service_delete',id=x.id)}}"><button class="btn danger">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
