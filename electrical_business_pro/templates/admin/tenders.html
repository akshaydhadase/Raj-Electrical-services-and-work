{% extends 'admin/layout.html' %}{% block admin %}<h1>Tender Management</h1><p><a class="btn success" href="{{url_for('tender_report')}}">⬇ Export Excel</a></p><div class="card"><form method="post" class="form"><input name="tender_no" placeholder="Tender No" required><input name="client" placeholder="Client / Organization" required><input name="department" placeholder="Department"><input name="title" placeholder="Title"><input name="opening_date" type="date"><input name="closing_date" type="date"><input name="estimated_value" type="number" step="0.01" placeholder="Estimated value"><input name="quoted_value" type="number" step="0.01" placeholder="Quoted value"><select name="status"><option>New</option><option>Applied</option><option>Review</option><option>Won</option><option>Lost</option><option>Pending</option></select><textarea name="remarks" placeholder="Remarks"></textarea><button class="btn">Add Tender</button></form></div><br><div class="tablewrap"><table class="table"><tr><th>No</th><th>Client</th><th>Title</th><th>Closing</th><th>Quoted</th><th>Status</th><th>Action</th></tr>{% for x in items %}<tr><td>{{x.tender_no}}</td><td>{{x.client}}</td><td>{{x.title}}</td><td>{{x.closing_date or '-'}}</td><td>₹{{'%.0f'|format(x.quoted_value)}}</td><td>{{x.status}}</td><td><form method="post" action="{{url_for('tender_delete',id=x.id)}}"><button class="btn danger">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
