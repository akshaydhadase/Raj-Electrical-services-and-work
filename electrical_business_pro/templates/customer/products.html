{% extends 'base.html' %}{% block content %}<div class="container"><h1>Products</h1><div class="grid">{% for p in products %}<div class="card"><span class="badge">{{p.code}}</span><h2>{{p.name}}</h2><p>{{p.brand}}</p><h3>₹{{'%.2f'|format(p.price)}}</h3><p>Stock: {{p.stock}}</p></div>{% endfor %}</div></div>{% endblock %}
