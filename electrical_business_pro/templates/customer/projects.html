{% extends 'base.html' %}{% block content %}<div class="container"><h1>Projects & Works</h1><div class="grid">{% for p in projects %}<div class="card">{% if p.image %}<img class="projectimg" src="{{url_for('static',filename='uploads/'+p.image)}}">{% endif %}<h2>{{p.title}}</h2><p>{{p.client}} · {{p.location}}</p><p>{{p.project_type}}</p><p class="muted">{{p.description}}</p></div>{% endfor %}</div></div>{% endblock %}
